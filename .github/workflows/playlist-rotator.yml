name: Playlist reshuffle

# Reshuffles the HeavyMusix Radio playlist on YouTube every morning
# Version 3: rolling reshuffle of the whole playlist, ~180 songs a day, bands spread evenly.
# Also adds owner-approved songs from rotator/add_queue.json, up to 20 a day, before reshuffling.
# Runs on GitHub's computers, so your laptop can stay off.
on:
  schedule:
    - cron: "5 10 * * *"   # every day at 5:05 AM Eastern (Eastern Standard Time; use 9 in summer)
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the YouTube tools
        run: pip install --quiet google-api-python-client google-auth-oauthlib ytmusicapi
      - name: Self-test the reshuffle script (a broken script never touches the playlist)
        run: python rotator/selftest.py
      - name: Sign in as HeavyMusix (from the YT_TOKEN secret)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          if [ -z "$YT_TOKEN" ]; then echo "The YT_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          printf '%s' "$YT_TOKEN" > rotator/token.json
      - name: Take off songs the owner removed (rotator/remove_queue.json; only when some are waiting)
        continue-on-error: true
        run: python rotator/remove_songs.py --apply
      - name: Move classical/jazz songs into the private HeavyMusix Roots playlist (only when some are waiting)
        continue-on-error: true
        run: python rotator/roots_move.py --apply
      - name: Add approved new songs (up to 20 a day, from rotator/add_queue.json)
        continue-on-error: true
        run: python rotator/add_songs.py --apply --max 20
      - name: Reshuffle the playlist (budget lowered by the songs just added, to stay inside YouTube's daily limit)
        run: |
          ADDED=$(cat rotator/added_today.txt 2>/dev/null || echo 0)
          ROOTS=$(cat rotator/roots_moved_today.txt 2>/dev/null || echo 0)
          REMOVED=$(cat rotator/removed_today.txt 2>/dev/null || echo 0)
          python rotator/playlist_rotator.py --apply --scheduled --budget $((180 - ADDED - ROOTS - REMOVED))
      - name: Remove the sign-in file
        if: always()
        run: rm -f rotator/token.json rotator/client_secret.json
      - name: Save which songs have had their turn
        run: |
          git config user.name "HeavyMusix Playlist Bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add rotator/rotator_memory.json rotator/add_queue.json rotator/roots_pending.json rotator/remove_queue.json; [ -f rotator/roots_playlist.txt ] && git add rotator/roots_playlist.txt || true
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Playlist reshuffle $(date -u '+%F')"
            git pull --rebase
            git push
          fi
