name: Music News headlines

on:
  schedule:
    - cron: "51 1,5,9,13,17,21 * * *"   # every 4 hours, one run at 4:51 AM Eastern (UTC times are for Eastern Standard Time; shift 1 hour earlier in March, back in November)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/wire.py
      - name: Install picture maker
        run: pip install --quiet pillow
      - name: Rebuild story, band and show pages, news feed and sitemap
        run: python scripts/build_pages.py
      - name: Publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "HeavyMusix News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add wire.js sitemap.xml feed.xml arizona-metal-shows.html news bands episodes og history this-week-in-metal.html
          if git diff --cached --quiet; then
            echo "No new headlines this run."
          else
            git commit -m "Wire (headline list only, not stories): $(date -u '+%F %H:%M')"
            git pull --rebase
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
