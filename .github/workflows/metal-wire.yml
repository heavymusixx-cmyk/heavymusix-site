name: Music News headlines

on:
  schedule:
    - cron: "15 0,4,8,12,16,20 * * *"   # every 4 hours (5:15 AM, 9:15 AM, 1:15 PM, 5:15 PM, 9:15 PM, 1:15 AM Arizona)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/wire.py
      - name: Install picture maker
        run: pip install --quiet pillow
      - name: Rebuild story, band and show pages, news feed and sitemap
        run: python scripts/build_pages.py
      - name: Publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "HeavyMusix News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add wire.js sitemap.xml feed.xml arizona-metal-shows.html news bands episodes og genres history this-week-in-metal.html
          if git diff --cached --quiet; then
            echo "No new headlines this run."
          else
            git commit -m "Music News: headlines $(date -u '+%F %H:%M')"
            git pull --rebase
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
