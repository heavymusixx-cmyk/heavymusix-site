name: Radio Show builder

on:
  schedule:
    - cron: "20 10 * * *"    # 5:20 AM Eastern, right after the morning stories and headlines (Eastern Standard Time; use 9 in summer)
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build episodes, song list and band directory
        run: python scripts/show.py
      - name: Install picture maker
        run: pip install --quiet pillow
      - name: Rebuild band and episode pages
        run: python scripts/build_pages.py
      - name: Publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "HeavyMusix Show Bot"
          git config user.email "show-bot@users.noreply.github.com"
          git add show sitemap.xml feed.xml arizona-metal-shows.html news bands episodes og genres history this-week-in-metal.html
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Radio Show: update $(date -u '+%F %H:%M')"
            git pull --rebase
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
