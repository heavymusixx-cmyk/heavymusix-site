name: Weekly fan email

on:
  schedule:
    - cron: "13 15 * * 5"    # Fridays 8:13 AM Arizona time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send "This week in metal" to the HeavyMusix Fans list (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/fan_email.py
