name: Build pages

# Turns news.js, shows.js and the show data into real pages Google can read:
# a page per story, band and episode, the Arizona shows page, the RSS feed and the sitemap.
on:
  push:
    branches: [main]
    paths: ["news.js", "shows.js", "venues.js", "show/**", "history.js", "article.html", "search.html", "style.css", "scripts/build_pages.py"]
  schedule:
    - cron: "41 7 * * *"     # every night at 12:41 AM Arizona time (rolls the shows page to the new day)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # build from the newest main, not the older commit that started this run (Nov 27 failure)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install picture maker
        run: pip install --quiet pillow
      - name: Build pages
        run: python scripts/build_pages.py
      - name: Publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "HeavyMusix Page Bot"
          git config user.email "page-bot@users.noreply.github.com"
          git add -A news bands episodes og history this-week-in-metal.html feed.xml sitemap.xml news-sitemap.xml arizona-metal-shows.html
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Pages: rebuild $(date -u '+%F %H:%M')"
            # Retry: another robot can push between our pull and push (Nov 24 failure).
            # If its pages clash with ours (Nov 27 failure), drop ours, take the newest main and rebuild on top.
            for i in 1 2 3 4; do
              if git pull --rebase; then
                git push && break
              else
                git rebase --abort || true
                git fetch origin main && git reset --hard origin/main
                python scripts/build_pages.py
                git add -A news bands episodes og history this-week-in-metal.html feed.xml sitemap.xml news-sitemap.xml arizona-metal-shows.html
                git diff --cached --quiet && { echo "Pages already up to date."; exit 0; }
                git commit -m "Pages: rebuild $(date -u '+%F %H:%M')"
                git push && break
              fi
              [ "$i" = 4 ] && exit 1
              sleep $((i*10))
            done
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
            sleep 60   # let GitHub Pages publish before telling search engines
            python scripts/indexnow.py
          fi
