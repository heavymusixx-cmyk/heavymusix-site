name: Song info (album and year)

on:
  schedule:
    - cron: "40 10 * * *"    # 5:40 AM Eastern, after the Radio Show builder refreshes the song list (Eastern Standard Time; use 9 in summer)
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: site-robots
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up album and year for new songs (MusicBrainz)
        run: python scripts/song_info.py
      - name: Publish if changed
        run: |
          git config user.name "HeavyMusix Song Bot"
          git config user.email "song-bot@users.noreply.github.com"
          git add show/songinfo.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Song info: $(date -u '+%F')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
